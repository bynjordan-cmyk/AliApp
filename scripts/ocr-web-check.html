<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Prueba de OCR real</title>
    <script type="importmap">
      {
        "imports": {
          "tesseract.js": "/vendor/tesseract-shim.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="estado">arrancando</div>
    <div id="lienzos"></div>

    <script type="module">
      // El proveedor lee la configuración como lo hace el bundle de Expo.
      globalThis.process = { env: { EXPO_PUBLIC_OCR_ASSET_BASE: '/ocr' } };

      const { webLabelOcrProvider } = await import('/providers/web.js');
      const { parseIngredientList } = await import('/ingredients.js');
      const { buildLabelScanResult } = await import('/label-scan.js');

      /**
       * Dibuja una etiqueta en un canvas, exactamente igual que hace la
       * aplicación cuando captura un fotograma de la cámara: canvas →
       * toDataURL → motor de OCR.
       */
      function pintarEtiqueta(lineas) {
        const canvas = document.createElement('canvas');
        canvas.width = 1000;
        canvas.height = 90 + lineas.length * 62;

        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#111111';
        ctx.font = '38px "DejaVu Sans", sans-serif';

        lineas.forEach((linea, indice) => {
          ctx.fillText(linea, 40, 80 + indice * 62);
        });

        document.getElementById('lienzos').appendChild(canvas);
        return canvas.toDataURL('image/jpeg', 0.95);
      }

      const ETIQUETA_A = [
        'INGREDIENTES: harina de trigo,',
        'leche en polvo, aceite de girasol,',
        'azucar, sal, lecitina de soja.',
      ];

      /**
       * Etiqueta C: la misma lista, pero fotografiada mal.
       *
       * Fondo con degradado, texto de bajo contraste, ruido por píxel, un
       * grado y medio de inclinación y JPEG de calidad mala. Se parece a una
       * foto de envase hecha de noche, que es cuando se usa esto.
       *
       * Existe por una razón concreta: hubo un preprocesado de imagen que
       * dejaba las etiquetas limpias intactas —A y B seguían pasando— y
       * destrozaba justo este caso. Una comprobación que solo mira imágenes
       * fáciles da luz verde a un escáner roto.
       */
      function pintarEtiquetaDificil(lineas) {
        const canvas = document.createElement('canvas');
        canvas.width = 900;
        canvas.height = 60 + lineas.length * 62;

        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const degradado = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        degradado.addColorStop(0, '#d8d4c8');
        degradado.addColorStop(1, '#b4b0a4');
        ctx.fillStyle = degradado;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((-1.6 * Math.PI) / 180);
        ctx.translate(-canvas.width / 2, -canvas.height / 2);
        ctx.fillStyle = '#4a4a46';
        ctx.font = '30px "DejaVu Sans", sans-serif';
        lineas.forEach((linea, indice) => ctx.fillText(linea, 70, 70 + indice * 62));
        ctx.restore();

        const datos = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const pixeles = datos.data;
        for (let i = 0; i < pixeles.length; i += 4) {
          const ruido = (Math.random() - 0.5) * 46;
          pixeles[i] += ruido;
          pixeles[i + 1] += ruido;
          pixeles[i + 2] += ruido;
        }
        ctx.putImageData(datos, 0, 0);

        document.getElementById('lienzos').appendChild(canvas);
        return canvas.toDataURL('image/jpeg', 0.5);
      }

      const ETIQUETA_B = [
        'INGREDIENTES: agua, arroz,',
        'zanahoria, aceite de oliva,',
        'patata, sal.',
      ];

      const ETIQUETA_C = [
        'INGREDIENTES: harina de trigo,',
        'azucar, aceite de girasol,',
        'leche en polvo, huevo, sal,',
        'cacao, lecitina de soja.',
      ];

      /** Palabras que tienen que sobrevivir a una foto mala. */
      const ESPERADAS_C = [
        'ingredientes', 'harina', 'trigo', 'azucar', 'aceite', 'girasol',
        'leche', 'polvo', 'huevo', 'sal', 'cacao', 'soja',
      ];

      const CATALOGO = [
        { canonicalKey: 'cow_milk', displayName: 'Leche de vaca' },
        { canonicalKey: 'wheat', displayName: 'Trigo' },
        { canonicalKey: 'soy', displayName: 'Soja' },
        { canonicalKey: 'rice', displayName: 'Arroz' },
        { canonicalKey: 'carrot', displayName: 'Zanahoria' },
        { canonicalKey: 'potato', displayName: 'Patata' },
      ];

      const ESTADOS = { cow_milk: 'avoid', wheat: 'tolerated', rice: 'tolerated' };

      const salida = { pasos: [] };

      try {
        const uriA = pintarEtiqueta(ETIQUETA_A);
        const uriB = pintarEtiqueta(ETIQUETA_B);
        const uriC = pintarEtiquetaDificil(ETIQUETA_C);

        document.getElementById('estado').textContent = 'leyendo A';
        const progresosA = [];
        const lecturaA = await webLabelOcrProvider.recognize({ uri: uriA }, (p) =>
          progresosA.push(p),
        );

        document.getElementById('estado').textContent = 'leyendo B';
        const lecturaB = await webLabelOcrProvider.recognize({ uri: uriB });

        document.getElementById('estado').textContent = 'leyendo C';
        const lecturaC = await webLabelOcrProvider.recognize({ uri: uriC });

        const ingredientesA = parseIngredientList(lecturaA.rawText);
        const ingredientesB = parseIngredientList(lecturaB.rawText);

        const resultadoA = buildLabelScanResult({
          rawText: lecturaA.rawText,
          catalog: CATALOGO,
          statusByKey: ESTADOS,
        });
        const resultadoB = buildLabelScanResult({
          rawText: lecturaB.rawText,
          catalog: CATALOGO,
          statusByKey: ESTADOS,
        });

        salida.ok = true;
        salida.a = {
          rawText: lecturaA.rawText,
          engine: lecturaA.engine,
          platform: lecturaA.platform,
          lineas: lecturaA.lines,
          bloques: lecturaA.blocks.length,
          ingredientes: ingredientesA,
          avoid: resultadoA.avoid.map((h) => `${h.matchedTerm}→${h.canonicalKey}`),
          otras: resultadoA.other.map((h) => h.canonicalKey),
          progresos: progresosA.length,
        };
        salida.b = {
          rawText: lecturaB.rawText,
          engine: lecturaB.engine,
          lineas: lecturaB.lines,
          ingredientes: ingredientesB,
          avoid: resultadoB.avoid.map((h) => `${h.matchedTerm}→${h.canonicalKey}`),
          otras: resultadoB.other.map((h) => h.canonicalKey),
        };
        const planoC = lecturaC.rawText
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase();

        salida.c = {
          rawText: lecturaC.rawText,
          encontradas: ESPERADAS_C.filter((palabra) => planoC.includes(palabra)),
          esperadas: ESPERADAS_C.length,
          avoid: buildLabelScanResult({
            rawText: lecturaC.rawText,
            catalog: CATALOGO,
            statusByKey: ESTADOS,
          }).avoid.map((h) => `${h.matchedTerm}→${h.canonicalKey}`),
        };
      } catch (error) {
        salida.ok = false;
        salida.error = String(error && error.stack ? error.stack : error);
      }

      window.__RESULTADO__ = salida;
      document.getElementById('estado').textContent = 'listo';
    </script>
  </body>
</html>
